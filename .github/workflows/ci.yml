name: SkillForge CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [skill-service, roadmap-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
      - run: python -c "import importlib.util,sys; importlib.util.spec_from_file_location('m','services/${{ matrix.service }}/main.py')"

  images:
    needs: [web, services]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t ghcr.io/${{ github.repository }}/web:${{ github.sha }} .
      - run: docker build -t ghcr.io/${{ github.repository }}/skill-service:${{ github.sha }} services/skill-service
      - run: docker build -t ghcr.io/${{ github.repository }}/roadmap-service:${{ github.sha }} services/roadmap-service
      - run: docker push --all-tags ghcr.io/${{ github.repository }}/web || true
