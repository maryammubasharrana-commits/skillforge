apiVersion: v1
kind: Namespace
metadata:
  name: skillforge
---
apiVersion: v1
kind: Secret
metadata:
  name: skillforge-secrets
  namespace: skillforge
type: Opaque
stringData:
  LOVABLE_API_KEY: "replace-me"
  VITE_SUPABASE_URL: "replace-me"
  VITE_SUPABASE_PUBLISHABLE_KEY: "replace-me"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: skillforge
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/skillforge/web:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - secretRef: { name: skillforge-secrets }
          env:
            - name: SKILL_SERVICE_URL
              value: http://skill-service:8001
            - name: ROADMAP_SERVICE_URL
              value: http://roadmap-service:8002
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: skillforge
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-service
  namespace: skillforge
spec:
  replicas: 2
  selector:
    matchLabels: { app: skill-service }
  template:
    metadata:
      labels: { app: skill-service }
    spec:
      containers:
        - name: skill-service
          image: ghcr.io/skillforge/skill-service:latest
          ports: [{ containerPort: 8001 }]
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: skill-service
  namespace: skillforge
spec:
  selector: { app: skill-service }
  ports: [{ port: 8001, targetPort: 8001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-service
  namespace: skillforge
spec:
  replicas: 2
  selector:
    matchLabels: { app: roadmap-service }
  template:
    metadata:
      labels: { app: roadmap-service }
    spec:
      containers:
        - name: roadmap-service
          image: ghcr.io/skillforge/roadmap-service:latest
          ports: [{ containerPort: 8002 }]
          envFrom:
            - secretRef: { name: skillforge-secrets }
          env:
            - name: SKILL_SERVICE_URL
              value: http://skill-service:8001
          readinessProbe:
            httpGet: { path: /health, port: 8002 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: roadmap-service
  namespace: skillforge
spec:
  selector: { app: roadmap-service }
  ports: [{ port: 8002, targetPort: 8002 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: skillforge
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
